# Configuration of the MS-COFD-2DSL (Multi-Scale Central Object Flow Dataset - 2D Steady Laminar) pipeline:
# geometry -> mesh -> OpenFOAM case -> arrays and attributes.
# All lengths are in mm (the .geo files multiply them with unit = 0.001 to get meters).
# The reasons behind the values are in docs/decisions.md.

name: MS-COFD-2DSL
version: 1.0.0

seed: 2026  # every case gets its own random generator derived from this seed, see geometries/sampling.py

# channel domain, the inlet is at x = 0 and the outlet at x = length
domain:
  length: 360
  height: 120

# Placement of the obstacles. Every obstacle is drawn around the nominal center, rotated about its centroid and
# moved by a random shift. An obstacle that does not keep the minimum gaps is drawn again (see check_geometry).
placement:
  center: [130, 60]     # nominal center, 130 mm from the inlet
  shift_x: [-30, 10]    # uniform, mm (more upstream than downstream, large obstacles need room for their wake)
  shift_y: [-15, 15]    # uniform, mm
  rotation: [-45, 45]   # uniform, degrees, counter-clockwise
  min_wall_gap: 5       # mm between the obstacle and the top / bottom walls
  min_inlet_gap: 60     # mm between the inlet and the obstacle
  min_outlet_gap: 150   # mm between the obstacle and the outlet
  max_blockage: 0.40    # height of the bounding box / channel height; above it the flow is not always steady (pilots)
  max_attempts: 1000    # drawing stops with an error after this many invalid obstacles

# characteristic mesh length (gmsh "size") for every resolution, in meters
resolutions:
  0.25x: 0.002
  base: 0.001
  4x: 0.0005
  16x: 0.00025

# which resolutions the geometry and mesh stages write by default
default_resolutions: [0.25x, base, 4x, 16x]

geometries: [rectangle, diamond, left_triangle, right_triangle, circle]

# number of cases for every size and geometry: 3 sizes x 5 geometries x 300 = 4500 cases
cases_per_geometry:
  normal: 300
  smaller: 300
  larger: 300

# Obstacle sizes, one sampling scheme for all sizes:
#   width  = nominal width  * scale * (1 + uniform(-width_jitter,  width_jitter))
#   height = nominal height * scale * (1 + uniform(-height_jitter, height_jitter))
# variance controls how far every corner can move away from its ideal position (see create_variance).
sizes:
  width_jitter: 0.10
  height_jitter: 0.20
  scale:
    normal: 1.0
    smaller: 0.65
    larger: 1.3
  nominal:
    rectangle:      {width: 50,   height: 25,   variance: 0.15}
    diamond:        {width: 50,   height: 25,   variance: 0.15}
    left_triangle:  {width: 42.5, height: 42.5, variance: 0.15}
    right_triangle: {width: 42.5, height: 42.5, variance: 0.15}
    circle:         {width: 25,   height: 25,   variance: 0.30}

# gmsh settings
meshing:
  gmsh: gmsh     # gmsh executable, or set the GMSH_BIN environment variable
  threads: 1     # gmsh -nt, threads per mesh (one CPU per job on the cluster, and deterministic meshes)
  workers: 1     # meshes created at the same time
  timeout: 3600  # seconds before a single mesh is given up
  # a mesh that fails checkMesh is made again with the next variant: gmsh options appended to the .geo file, tried in
  # this order ('' = the .geo file as written); the variant used is recorded in the provenance of the run
  # (pilot: 1 of 45 0.25 mm meshes had a folded pair of triangles; Smoothing 5 gave a valid all-quad mesh,
  # RecombinationAlgorithm 0 a valid mesh with ~4300 triangles, RandomFactor 1e-8 the same mesh, Algorithm 6 crashed)
  variants:
    - ''
    - 'Mesh.Smoothing = 5;'
    - 'Mesh.Smoothing = 10;'
    - 'Mesh.RecombinationAlgorithm = 0;'

# The OpenFOAM runs of every case (openfoam/case-templates/<templates>/<resolution>):
#   0.25x   : 2 mm mesh, second-order upwind convection (the coarsest level, a quarter of the base cells)
#   base_fo : 1 mm mesh, first-order upwind convection (a cheaper, more diffusive low-fidelity solution)
#   base_lu : 1 mm mesh, second-order upwind convection (linearUpwind)
#   4x, 16x : 0.5 mm and 0.25 mm meshes, second order, started from the base_lu solution (mapFields)
runs:
  0.25x:   {resolution: 0.25x, templates: second-order}
  base_fo: {resolution: base, templates: first-order}
  base_lu: {resolution: base, templates: second-order}
  4x:      {resolution: 4x,   templates: second-order, init_from: base_lu}
  16x:     {resolution: 16x,  templates: second-order, init_from: base_lu}

# grid size of the arrays (one point per 2 mm for 0.25x, per mm for base, two per mm for 4x, four for 16x)
extraction:
  0.25x: [180, 60]
  base: [360, 120]
  4x: [720, 240]
  16x: [1440, 480]

# folders, relative to the data root: the MSCOFD_DATA_ROOT environment variable, or outputs/ in the repository
# (on KUACC: /kuacc/users/asaydam21/hpc_run/ms-cofd-2dsl, see hpc/env.sh)
paths:
  geo_files: geometry/geo-files
  manifest: geometry/manifest.csv
  mesh_files: meshes
  cases: work
  results: results
  archives: archives
  logs: logs
  dataset: dataset
