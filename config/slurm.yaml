# SLURM settings of the production on KUACC, read by hpc/topup.py.
# Limits of the temporary allocation (support ticket, 5-19 Oct 2026): QoS asaydam_oct26 on partition mid, at most
# 150 running jobs / 150 CPUs and 300 running + pending jobs, 1 CPU, <= 8 GB and <= 24 h per job.

account: users
partition: mid
job_name_prefix: m2d   # job names: m2d_<run>_<case>

# QoS by date: the first window whose end is still ahead is used. max_queued is the number of running + pending
# jobs topup.py keeps (below the hard limit of the QoS, so the other users' view of the queue stays reasonable).
windows:
  - qos: asaydam_oct26
    start: "2026-10-05T00:00:00+03:00"
    end: "2026-10-19T00:00:00+03:00"
    max_queued: 280
  - qos: users
    start: "2026-01-01T00:00:00+03:00"
    end: "2027-12-31T00:00:00+03:00"
    max_queued: 45

# time and memory per run, set from the pilot (an interrupted job is submitted again and continues the run)
runs:
  0.25x:   {time: "01:00:00", mem: 2G}
  base_fo: {time: "01:00:00", mem: 2G}
  base_lu: {time: "01:00:00", mem: 2G}
  4x:      {time: "06:00:00", mem: 3G}
  16x:     {time: "20:00:00", mem: 6G}

# footprint guard (the user quota is 1 TiB): submissions pause above these values (GiB)
footprint:
  pause_used_gib: 600     # beegfs-ctl --getquota of the user
  pause_backlog_gib: 200  # archives not yet uploaded

max_attempts: 3          # an interrupted or failed task is submitted again at most this many times
min_interval_s: 60       # topup.py does nothing when it ran less than this many seconds ago
