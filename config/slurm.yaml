# SLURM settings of the production on KUACC, read by hpc/topup.py.
# Limits of the temporary allocation (support ticket, 5-19 Oct 2026): QoS asaydam_oct26 on partition mid, at most
# 150 running jobs / 150 CPUs and 300 running + pending jobs, 1 CPU, <= 8 GB and <= 24 h per job.

account: users
partition: mid
# nodes of the partition where the container cannot start (Apptainer: "can't open /proc/self/mountinfo"; dy02 and
# dy03 are GPU nodes of the ai partition); jobs also add nodes to <data root>/state/bad_nodes, see hpc/job_task.sh
exclude_nodes: [dy02, dy03]
bad_node_hours: 6     # a node in state/bad_nodes is tried again after this many hours
job_name_prefix: m2d   # job names: m2d_<run>_<case>

# QoS by date: the first window whose end is still ahead is used. max_queued is the number of running + pending
# jobs topup.py keeps: below the limits of the account (150 running, 300 running + pending, shared with validation
# runs), so the other users' view of the queue stays reasonable.
windows:
  - qos: asaydam_oct26
    start: "2026-10-05T00:00:00+03:00"
    end: "2026-10-19T00:00:00+03:00"
    max_queued: 240
  - qos: users
    start: "2026-01-01T00:00:00+03:00"
    end: "2027-12-31T00:00:00+03:00"
    max_queued: 45

# time and memory per run, from the pilots (an interrupted job is submitted again and continues the run). Solver
# alone (peak resident memory, longest converged run): 0.25x 45 MB / 0.1 h, base 90 MB / 0.6 h at the iteration cap,
# 4x 264 MB / 0.7 h, 16x 942 MB / 4.7 h; meshing (gmsh) and the arrays (VTK) add to the memory
runs:
  0.25x:   {time: "02:00:00", mem: 1G}
  base_fo: {time: "02:00:00", mem: 1G}
  base_lu: {time: "02:00:00", mem: 1G}
  4x:      {time: "03:00:00", mem: 2G}
  16x:     {time: "12:00:00", mem: 4G}

# footprint guard (the user quota is 1 TiB): submissions pause above these values (GiB). /scratch is BeeGFS with
# buddy mirroring: the quota usage (beegfs-ctl) counts every file twice, so 600 GiB used is ~300 GiB of data.
footprint:
  pause_used_gib: 600     # beegfs-ctl --getquota of the user (mirrored, twice the data)
  pause_backlog_gib: 50   # archives not yet uploaded (file sizes, ~100 GiB of quota)

# dashboard: hpc/publish_status.py pushes the status of the production to this repository (deploy key in
# config/github_status_key on the cluster); its GitHub Pages page shows it
status:
  repo: git@github.com:ASaydam/ms-cofd-2dsl-status.git
  branch: data
  every_min: 10

max_attempts: 3          # submissions of a task at most (an interrupted or failed task is submitted again)
min_interval_s: 30       # at most one topup.py call per this many seconds; a job that ends waits for its
                         # turn (or returns when a later call covered it)
