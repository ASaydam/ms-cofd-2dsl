# Builds the pipeline container (environment/Dockerfile), runs the tests in it and pushes it to
# ghcr.io/asaydam/ms-cofd-2dsl. Tags: the commit sha, and the version tag when one is pushed (v1.0.0, ...).
name: container

on:
  push:
    branches: [main]
    paths: ['environment/**', '.github/workflows/container.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/asaydam/ms-cofd-2dsl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (loaded locally for the tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: environment/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests and versions in the container
        run: |
          # the entrypoint of the OpenFOAM image changes the working directory, bash is started directly
          docker run --rm --entrypoint bash -v "$PWD:/repo" ${{ env.IMAGE }}:test \
            -c "cd /repo && source /opt/mscofd/activate.sh && cat /opt/mscofd/versions/summary.txt && python -m pytest -q -p no:cacheprovider tests"
          mkdir -p versions-out
          docker run --rm --entrypoint bash ${{ env.IMAGE }}:test -c "tar -C /opt/mscofd -cf - versions" | tar -xf - -C versions-out

      - uses: actions/upload-artifact@v4
        with:
          name: versions
          path: versions-out/versions

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: environment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
